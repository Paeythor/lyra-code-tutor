<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyra — AI Code Tutor</title>
  <meta name="description" content="Learn to code with Lyra, your AI-powered coding tutor.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>
  <div id="app">
    <nav id="navbar">
      <div class="nav-logo" onclick="App.showHome()">
        <img src="assets/avatar.png" alt="Lyra">
        <span>Lyra Code Tutor</span>
      </div>
      <div class="nav-spacer"></div>
      <span id="nav-xp">Lv.1 · 0 XP</span>
      <button class="nav-btn" onclick="App.showHome()">🏠 Home</button>
      <button class="nav-btn" onclick="showKeyPrompt()">🔑 API Key</button>
    </nav>
    <main id="main-content">
      <div style="display:flex;align-items:center;justify-content:center;height:60vh;color:var(--muted);">
        Loading Lyra...
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/tutor.js"></script>
  <script src="js/app.js"></script>
  <script>
    function showKeyPrompt() {
  const key = prompt('Enter your Gemini API key (AIza...):');
  if (key && key.length > 10) {
    Tutor.setApiKey(key);
    alert('✅ Key saved for this session!');
  } else if (key) {
    alert('Key looks too short, please try again.');
  }
}
  </script>
</body>
</html>
